name: Android app

# Builds the native app (Kotlin + Jetpack Compose) on every push, runs the backend tests,
# and publishes the APK as a download.
on:
  push:
    branches: [native-app]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet "psycopg[binary]"
      - name: Backend tests (migrations, game rules, privacy, weekly import)
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: supabase/tests/run.sh

  # the real app on an Android emulator, against a throwaway backend (Postgres + PostgREST + a stand-in for sign-in emails)
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Test backend
        run: |
          pip install --quiet "psycopg[binary]"
          psql -qX -d postgres -c "create database twominds_test"
          psql -qX -v ON_ERROR_STOP=1 -d twominds_test -f supabase/tests/stubs.sql
          for f in supabase/migrations/*.sql; do psql -qX -v ON_ERROR_STOP=1 -d twominds_test -f "$f"; done
          psql -qX -v ON_ERROR_STOP=1 -d twominds_test -f supabase/seed.sql
          psql -qX -v ON_ERROR_STOP=1 -d twominds_test -f android/e2e/setup.sql
          curl -sSL -o /tmp/pgrst.tar.xz https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          tar -xJf /tmp/pgrst.tar.xz -C /tmp
          printf 'db-uri = "postgres://authenticator:authpass@localhost:5432/twominds_test"\ndb-schemas = "public"\ndb-anon-role = "anon"\njwt-secret = "e2e-secret-e2e-secret-e2e-secret-123"\nserver-port = 3000\n' > /tmp/pgrst.conf
          nohup /tmp/postgrest /tmp/pgrst.conf > /tmp/pgrst.log 2>&1 &
          DB_DSN="host=localhost user=postgres password=postgres dbname=twominds_test" nohup python3 android/e2e/fake_server.py > /tmp/fake.log 2>&1 &
          sleep 3; curl -sf -X POST localhost:8000/auth/v1/otp -d '{}' && echo backend up
      - name: Build the test APK (talks to the emulator host)
        working-directory: android
        env: { SUPABASE_URL: 'http://10.0.2.2:8000', SUPABASE_ANON_KEY: 'anon', ALLOW_CLEARTEXT: 'true' }
        run: gradle --no-daemon --console=plain assembleRelease
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Play the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell settings put global window_animation_scale 0 && adb shell settings put global transition_animation_scale 0
            python3 android/e2e/drive.py 2>&1 | tee /tmp/drive.log
      - name: Show what went wrong
        if: always()
        run: |
          grep -E "^FAIL |^ERROR|FATAL|Exception|FAILED:" -A3 /tmp/drive.log 2>/dev/null | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/msg || true
          echo "::notice title=Phone test::$(cat /tmp/msg)"
          tail -5 /tmp/fake.log /tmp/pgrst.log || true
      - name: Publish screenshots
        if: always()
        run: cd android/e2e && zip -q -r "$GITHUB_WORKSPACE/phone-screens.zip" shots || true
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ci-phone-screens
          name: Phone test screenshots (CI)
          prerelease: true
          make_latest: false
          files: phone-screens.zip
          body: Screenshots from the automated emulator run of the native app. Run ${{ github.run_number }}, ${{ github.sha }}.

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/two-minds-native.apk"
      - name: Show what went wrong
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            msg=$(grep -E "^e: |error:|What went wrong|^> |Could not|Unresolved|FAILED" -A1 "$RUNNER_TEMP/build.log" | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::$msg"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: two-minds-native-apk, path: two-minds-native.apk }
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-native
          name: Two Minds 2.0 for Android (native, test build)
          prerelease: true
          make_latest: false
          files: two-minds-native.apk
          body: |
            **Two Minds 2.0: the native Android app** (Kotlin + Jetpack Compose), with accounts, friends and fresh questions.

            Install: on the phone, tap `two-minds-native.apk` below, open it and allow the install. It replaces the earlier
            Two Minds app (same signature). Sign in with your email; the 6-digit code arrives by email.

            Build ${{ github.run_number }} from `${{ github.ref_name }}` (${{ github.sha }}).
