name: Android app

# Builds the installable APK from the web game on every push and publishes it as a download.
on:
  push:
    branches: [android-app, main]
    paths-ignore: ['**.md', 'tests/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the web game
        run: |
          node --check src/app.js
          python3 build.py
          test -s android/app/src/main/assets/www/index.html
          grep -q TwoMindsNative android/app/src/main/assets/www/index.html

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Optional: sign with a private key instead of the committed sideload key (see android/README.md)
      - name: Use private signing key if configured
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/two-minds.apk"
          ls -l "$GITHUB_WORKSPACE/two-minds.apk"

      - name: Show what went wrong
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            msg=$(grep -E "error:|warning: \[|What went wrong|^> |FAILED|Could not|Exception" -A2 "$RUNNER_TEMP/build.log" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::$msg"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: two-minds-apk
          path: two-minds.apk

      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Two Minds for Android (latest build)
          prerelease: true
          make_latest: false
          files: two-minds.apk
          body: |
            **Install on an Android phone**
            1. On the phone, tap `two-minds.apk` below to download it.
            2. Open the downloaded file. Android asks once to allow installs from your browser: allow it, then tap Install.
            3. Newer builds install over the old one and keep your progress.

            Build ${{ github.run_number }} from `${{ github.ref_name }}` (${{ github.sha }}).
