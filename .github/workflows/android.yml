name: Android app

# Builds the native app (Kotlin + Jetpack Compose) on every push, runs the backend tests,
# and publishes the APK as a download.
on:
  push:
    branches: [native-app]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install --quiet "psycopg[binary]"
      - name: Backend tests (migrations, game rules, privacy, weekly import)
        env: { PGHOST: localhost, PGPORT: '5432', PGUSER: postgres, PGPASSWORD: postgres }
        run: supabase/tests/run.sh

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.0.${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/two-minds-native.apk"
      - name: Show what went wrong
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            msg=$(grep -E "^e: |error:|What went wrong|^> |Could not|Unresolved|FAILED" -A1 "$RUNNER_TEMP/build.log" | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Android build failed::$msg"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: two-minds-native-apk, path: two-minds-native.apk }
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-native
          name: Two Minds 2.0 for Android (native, test build)
          prerelease: true
          make_latest: false
          files: two-minds-native.apk
          body: |
            **Two Minds 2.0: the native Android app** (Kotlin + Jetpack Compose), with accounts, friends and fresh questions.

            Install: on the phone, tap `two-minds-native.apk` below, open it and allow the install. It replaces the earlier
            Two Minds app (same signature). Sign in with your email; the 6-digit code arrives by email.

            Build ${{ github.run_number }} from `${{ github.ref_name }}` (${{ github.sha }}).
