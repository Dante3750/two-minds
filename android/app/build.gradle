plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Two Minds for Android: native Kotlin + Jetpack Compose. Talks to the Supabase backend over plain HTTPS.
def env = { String k, String d -> System.getenv(k) ?: d }
def props = new Properties()
def pf = rootProject.file('supabase.properties')
if (pf.exists()) pf.withInputStream { props.load(it) }

android {
    namespace 'io.github.dante3750.twominds'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.dante3750.twominds'
        minSdk 26
        targetSdk 35
        versionCode env('VERSION_CODE', '100').toInteger()
        versionName env('VERSION_NAME', '2.0')
        // public project address and key (safe to ship; the database rules decide what they can do)
        buildConfigField 'String', 'SUPABASE_URL', "\"${env('SUPABASE_URL', props.getProperty('url', ''))}\""
        // only the automated emulator test talks to a local http server; real builds are https-only
        manifestPlaceholders = [cleartext: env('ALLOW_CLEARTEXT', 'false')]
        buildConfigField 'String', 'SUPABASE_ANON_KEY', "\"${env('SUPABASE_ANON_KEY', props.getProperty('anonKey', ''))}\""
    }

    signingConfigs {
        // same key as the earlier app, so this installs over it (see android/README.md)
        release {
            storeFile file(env('KEYSTORE_FILE', 'sideload.keystore'))
            storePassword env('KEYSTORE_PASSWORD', 'twominds')
            keyAlias env('KEY_ALIAS', 'twominds')
            keyPassword env('KEY_PASSWORD', 'twominds')
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug { signingConfig signingConfigs.release }
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
